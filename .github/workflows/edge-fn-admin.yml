# Edge Function admin (manual) — list or delete edge functions via the
# Supabase Management API, using the same SUPABASE_ACCESS_TOKEN secret the
# deploy workflow uses. Needed because the project hit its edge-function
# cap; freeing dead functions makes room for new ones.
#
#   method=list             → print every deployed function slug (sorted)
#   method=delete + slugs   → delete the given comma-separated slugs
name: Edge Function Admin (manual)

on:
  workflow_dispatch:
    inputs:
      method:
        description: "list | delete | set-openai-key"
        required: true
        default: "list"
      slugs:
        description: "Comma-separated function slugs to delete (delete only)"
        required: false
        default: ""

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - name: Run
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: qxllysilzonrlyoaomce
          METHOD: ${{ github.event.inputs.method }}
          SLUGS: ${{ github.event.inputs.slugs }}
          NEW_KEY: ${{ secrets.OPENAI_API_KEY_NEW }}
        run: |
          set -euo pipefail
          BASE="https://api.supabase.com/v1/projects/${PROJECT_REF}/functions"

          # Sync a valid OpenAI key from the OPENAI_API_KEY_NEW repo secret into
          # the project's edge-function secrets (never prints the key).
          if [ "$METHOD" = "set-openai-key" ]; then
            if [ -z "${NEW_KEY:-}" ]; then
              echo "::error::Repo secret OPENAI_API_KEY_NEW is not set. Add it in Settings → Secrets and variables → Actions."
              exit 1
            fi
            FP="$(printf '%s' "$NEW_KEY" | cut -c1-8)…$(printf '%s' "$NEW_KEY" | rev | cut -c1-4 | rev)"
            echo "Setting OPENAI_API_KEY on ${PROJECT_REF} (fingerprint ${FP}, length ${#NEW_KEY})"
            code=$(curl -sS -o /tmp/out -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/${PROJECT_REF}/secrets" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$(jq -nc --arg v "$NEW_KEY" '[{name:"OPENAI_API_KEY", value:$v}]')")
            if [ "$code" = "200" ] || [ "$code" = "201" ] || [ "$code" = "204" ]; then
              echo "✅ OPENAI_API_KEY updated on ${PROJECT_REF}"
            else
              echo "::error::Set secret returned HTTP $code: $(cat /tmp/out)"; exit 1
            fi
            exit 0
          fi

          # Set RESTYLEPRO_API_KEY from the slugs input (value passed at dispatch).
          if [ "$METHOD" = "set-restylepro-key" ]; then
            if [ -z "${SLUGS:-}" ]; then echo "::error::pass the key in the 'slugs' input"; exit 1; fi
            FP="$(printf '%s' "$SLUGS" | cut -c1-9)…$(printf '%s' "$SLUGS" | rev | cut -c1-4 | rev)"
            echo "Setting RESTYLEPRO_API_KEY on ${PROJECT_REF} (fingerprint ${FP})"
            code=$(curl -sS -o /tmp/out -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/${PROJECT_REF}/secrets" \
              -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
              -d "$(jq -nc --arg v "$SLUGS" '[{name:"RESTYLEPRO_API_KEY", value:$v}]')")
            if [ "$code" = "200" ] || [ "$code" = "201" ] || [ "$code" = "204" ]; then
              echo "✅ RESTYLEPRO_API_KEY set on ${PROJECT_REF}"
            else echo "::error::Set secret returned HTTP $code: $(cat /tmp/out)"; exit 1; fi
            exit 0
          fi

          if [ "$METHOD" = "list" ]; then
            echo "Deployed functions on ${PROJECT_REF}:"
            curl -sS -H "Authorization: Bearer ${TOKEN}" "$BASE" \
              | jq -r '.[].slug' | sort
            echo "---"
            echo "TOTAL: $(curl -sS -H "Authorization: Bearer ${TOKEN}" "$BASE" | jq 'length')"
            exit 0
          fi

          if [ "$METHOD" = "delete" ]; then
            if [ -z "$SLUGS" ]; then echo "::error::slugs required for delete"; exit 1; fi
            echo "$SLUGS" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' | while read -r slug; do
              echo "::group::Deleting $slug"
              code=$(curl -sS -o /tmp/out -w '%{http_code}' -X DELETE \
                -H "Authorization: Bearer ${TOKEN}" "$BASE/$slug")
              if [ "$code" = "200" ] || [ "$code" = "204" ]; then
                echo "✅ deleted $slug"
              else
                echo "::warning::delete $slug returned HTTP $code: $(cat /tmp/out)"
              fi
              echo "::endgroup::"
            done
            exit 0
          fi

          echo "::error::method must be 'list' or 'delete'"; exit 1
