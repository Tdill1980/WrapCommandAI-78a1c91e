# Edge Function admin (manual) — list or delete edge functions via the
# Supabase Management API, using the same SUPABASE_ACCESS_TOKEN secret the
# deploy workflow uses. Needed because the project hit its edge-function
# cap; freeing dead functions makes room for new ones.
#
#   method=list             → print every deployed function slug (sorted)
#   method=delete + slugs   → delete the given comma-separated slugs
name: Edge Function Admin (manual)

on:
  workflow_dispatch:
    inputs:
      method:
        description: "list or delete"
        required: true
        default: "list"
      slugs:
        description: "Comma-separated function slugs to delete (delete only)"
        required: false
        default: ""

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - name: Run
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: qxllysilzonrlyoaomce
          METHOD: ${{ github.event.inputs.method }}
          SLUGS: ${{ github.event.inputs.slugs }}
        run: |
          set -euo pipefail
          BASE="https://api.supabase.com/v1/projects/${PROJECT_REF}/functions"

          if [ "$METHOD" = "list" ]; then
            echo "Deployed functions on ${PROJECT_REF}:"
            curl -sS -H "Authorization: Bearer ${TOKEN}" "$BASE" \
              | jq -r '.[].slug' | sort
            echo "---"
            echo "TOTAL: $(curl -sS -H "Authorization: Bearer ${TOKEN}" "$BASE" | jq 'length')"
            exit 0
          fi

          if [ "$METHOD" = "delete" ]; then
            if [ -z "$SLUGS" ]; then echo "::error::slugs required for delete"; exit 1; fi
            echo "$SLUGS" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' | while read -r slug; do
              echo "::group::Deleting $slug"
              code=$(curl -sS -o /tmp/out -w '%{http_code}' -X DELETE \
                -H "Authorization: Bearer ${TOKEN}" "$BASE/$slug")
              if [ "$code" = "200" ] || [ "$code" = "204" ]; then
                echo "✅ deleted $slug"
              else
                echo "::warning::delete $slug returned HTTP $code: $(cat /tmp/out)"
              fi
              echo "::endgroup::"
            done
            exit 0
          fi

          echo "::error::method must be 'list' or 'delete'"; exit 1
