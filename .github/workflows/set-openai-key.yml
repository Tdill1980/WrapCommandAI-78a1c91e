# Sync the OpenAI API key from a GitHub Actions secret into the Supabase
# project's Edge Function secrets, using the Supabase Management API and the
# same SUPABASE_ACCESS_TOKEN the deploy workflow uses.
#
# Setup (one time): add a repo secret named OPENAI_API_KEY_NEW
#   GitHub repo → Settings → Secrets and variables → Actions →
#   New repository secret → name: OPENAI_API_KEY_NEW, value: <your sk-... key>
#
# Then run this workflow (Actions tab → "Set OpenAI Key" → Run workflow), or it
# gets triggered for you. The key value is never printed.
name: Set OpenAI Key (manual)

on:
  workflow_dispatch: {}

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Push OPENAI_API_KEY into Supabase edge secrets
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEW_KEY: ${{ secrets.OPENAI_API_KEY_NEW }}
          PROJECT_REF: qxllysilzonrlyoaomce
        run: |
          set -euo pipefail
          if [ -z "${NEW_KEY:-}" ]; then
            echo "::error::Repo secret OPENAI_API_KEY_NEW is not set. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Fingerprint only (first 8 + last 4) so we can confirm which key without exposing it.
          FP="$(printf '%s' "$NEW_KEY" | cut -c1-8)…$(printf '%s' "$NEW_KEY" | rev | cut -c1-4 | rev)"
          echo "Setting OPENAI_API_KEY on ${PROJECT_REF} (fingerprint ${FP}, length ${#NEW_KEY})"
          code=$(curl -sS -o /tmp/out -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/secrets" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg v "$NEW_KEY" '[{name:"OPENAI_API_KEY", value:$v}]')")
          if [ "$code" = "200" ] || [ "$code" = "201" ] || [ "$code" = "204" ]; then
            echo "✅ OPENAI_API_KEY updated on ${PROJECT_REF}"
          else
            echo "::error::Set secret returned HTTP $code: $(cat /tmp/out)"
            exit 1
          fi
