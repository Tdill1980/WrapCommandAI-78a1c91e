# Set a Supabase Edge Function secret via the Management API (manual).
# Uses the same SUPABASE_ACCESS_TOKEN secret as the other workflows.
name: Set Function Secret (manual)

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Secret name"
        required: true
      value:
        description: "Secret value"
        required: true

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Set secret via Management API
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: qxllysilzonrlyoaomce
          NAME: ${{ github.event.inputs.name }}
          VALUE: ${{ github.event.inputs.value }}
        run: |
          set -euo pipefail
          body=$(jq -cn --arg n "$NAME" --arg v "$VALUE" '[{name:$n, value:$v}]')
          code=$(curl -sS -o /tmp/out -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/secrets" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" -d "$body")
          if [ "$code" = "200" ] || [ "$code" = "201" ]; then
            echo "✅ set secret $NAME"
          else
            echo "::error::set secret HTTP $code: $(cat /tmp/out)"; exit 1
          fi
