# Apply a repo SQL file to the production database via the Supabase
# Management API (same SUPABASE_ACCESS_TOKEN secret the edge-function deploy
# workflow uses). Manual-only: run it from the Actions tab with the
# repo-relative path of a .sql file (typically a supabase/migrations/ file).
name: Apply SQL File (manual)

on:
  workflow_dispatch:
    inputs:
      file:
        description: "Repo-relative path to a .sql file (e.g. supabase/migrations/20260707000000_x.sql)"
        required: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply SQL via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SQL_FILE: ${{ github.event.inputs.file }}
        run: |
          set -euo pipefail
          case "$SQL_FILE" in
            *.sql) ;;
            *) echo "::error::input must be a .sql file"; exit 1 ;;
          esac
          if [ ! -f "$SQL_FILE" ]; then
            echo "::error::file not found: $SQL_FILE"; exit 1
          fi
          echo "Applying $SQL_FILE"
          jq -n --rawfile sql "$SQL_FILE" '{query: $sql}' > /tmp/body.json
          curl -fsS -X POST \
            "https://api.supabase.com/v1/projects/qxllysilzonrlyoaomce/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d @/tmp/body.json
          echo "Applied."
