# Raise the project-wide Storage upload size limit via the Supabase Management
# API (per-bucket file_size_limit cannot exceed this global cap). Manual-only.
# Prints the current config, then PATCHes fileSizeLimit, then prints the result.
name: Set Storage Limit (manual)

on:
  workflow_dispatch:
    inputs:
      bytes:
        description: "New global storage file size limit in bytes (e.g. 524288000 = 500MB)"
        required: true
        default: "524288000"

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Update storage config
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BYTES: ${{ github.event.inputs.bytes }}
        run: |
          set -euo pipefail
          REF=qxllysilzonrlyoaomce
          echo "=== current storage config ==="
          curl -fsS "https://api.supabase.com/v1/projects/$REF/config/storage" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" | tee /tmp/cur.json
          echo
          echo "=== patching fileSizeLimit=$BYTES ==="
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$REF/config/storage" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"fileSizeLimit\": ${BYTES}}" | tee /tmp/new.json
          echo
          echo "Done."
